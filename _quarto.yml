project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - dashboard.qmd
    - cep-dashboard.qmd
    - css-scss.qmd
    - listings.qmd
    - "posts/*/index.qmd"

website:
  title: "Ron Stephen Sabilla"
  description: "Digital marketing analytics portfolio, MSDM at Cal Poly Pomona"
  site-url: "https://rsabilla.github.io/m10-quarto-website/"
  repo-url: "https://github.com/rsabilla/m10-quarto-website"
  repo-actions: [source]
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Dashboard"
        href: dashboard.qmd
      - text: "CSS & SCSS"
        href: css-scss.qmd
      - text: "Listings"
        href: listings.qmd
    right:
      - icon: github
        href: "https://github.com/rsabilla/m10-quarto-website"
        aria-label: GitHub repo
  page-footer:
    left: "© 2026 Ron Stephen Sabilla"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
