project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - digital-marketing.qmd
    - analytics.qmd
    - resume.qmd
    - "projects/*/*/index.qmd"
    - projects/analytics/followers-to-donors/slides.qmd
  resources:
    - "cv/*.pdf"

website:
  title: "Ron Stephen Sabilla"
  description: "Digital marketing and analytics portfolio, MSDM at Cal Poly Pomona"
  site-url: "https://rsabilla.github.io/m10-quarto-website/"
  repo-url: "https://github.com/rsabilla/m10-quarto-website"
  repo-actions: [source]
  google-analytics: "G-88YVYXFN72"
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Digital Marketing Projects"
        href: digital-marketing.qmd
      - text: "Marketing Analytics Projects"
        href: analytics.qmd
      - text: "Resume"
        href: resume.qmd
    right:
      - icon: github
        href: "https://github.com/rsabilla"
        aria-label: GitHub
  page-footer:
    left: "© 2026 Ron Stephen Sabilla"
    right: "Built with [Quarto](https://quarto.org) · Hosted on GitHub Pages"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
